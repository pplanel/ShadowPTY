name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test & Lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            accept-flake-config = true

      - name: Cache Nix Store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Check Flake
        run: nix flake check

      - name: Check Formatting
        run: nix develop --command cargo fmt --check

      - name: Clippy Lints
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: Run Tests
        run: nix develop --command cargo test --all-targets

      # Same runner and target/ as the test step: the server is already built, and the example
      # binary links from what it compiled (cargo test leaves only a hashed copy of it)
      - name: Run MCP Scripts
        run: |
          nix develop --command bash -c '
            cargo build --bin shadowpty --example mcp_script || exit 2
            failed=0
            for script in mcp-tests/auto-test/scripts/*.json; do
              echo "::group::$script"
              SHADOWPTY_BIN="$PWD/target/debug/shadowpty" target/debug/examples/mcp_script "$script" || failed=1
              echo "::endgroup::"
            done
            exit $failed
          '

      - name: Build Package
        run: nix build
