name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # SHA-pinned, so the channel can't be read from the @ref; set it explicitly.
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git --rev v0.2.5

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Codesign binary (macOS)
        if: runner.os == 'macOS'
        run: codesign -s - -f target/${{ matrix.target }}/release/shadowpty

      - name: Prepare release artifacts
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/shadowpty"
          # Standalone binary for npm runner
          cp "$BIN_PATH" "dist/shadowpty-${{ matrix.target }}"
          # Compressed tarball for manual download
          tar -czvf "dist/shadowpty-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" shadowpty

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifacts-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  mcpb:
    name: Pack MCPB bundle
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: artifacts-*
          path: binaries
          merge-multiple: true

      - name: Pack bundle
        run: scripts/pack-mcpb.sh binaries "${GITHUB_REF_NAME#v}"

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mcpb
          path: dist/shadowpty.mcpb
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build, mcpb]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: all-artifacts/*
          generate_release_notes: true

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Update npm
        run: npm install -g npm@latest

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd npm
          PKG_NAME=$(node -p "require('./package.json').name")

          if npm view "$PKG_NAME@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION of $PKG_NAME is already published on npm. Skipping publish."
            exit 0
          fi

          npm version "$VERSION" --allow-same-version --no-git-tag-version
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
            npm publish --access public
          else
            npm publish --access public --provenance
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
