# Define minimum supported Rust version (Edition 2024 stabilized in 1.85+)
msrv = "1.85.0"

# --- Complexity & Structure ---

# Cognitive complexity threshold for functions
cognitive-complexity-threshold = 15

# Line threshold for methods
too-many-lines-threshold = 80

# Argument count threshold
too-many-arguments-threshold = 4

# --- Types & Safety ---

# Avoid boolean blindness
max-fn-params-bools = 1

# Allow unwrap() and expect() in unit/integration tests
allow-unwrap-in-tests = true

# Allow debug printing in tests only
allow-print-in-tests = true

# --- Naming & Documentation ---

enum-variant-name-threshold = 3
enum-variant-size-threshold = 256

# Technical terms recognized in documentation
doc-valid-idents = [
  "PTY",
  "TUI",
  "MCP",
  "VT100",
  "ANSI",
  "LLM",
  "JSON-RPC",
  "stdio",
  "stderr",
  "stdout",
  "ShadowPTY",
]
