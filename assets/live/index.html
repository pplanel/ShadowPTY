<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>ShadowPTY live</title>
<style>
  /* Tokens. Text colors meet WCAG 2.2 AA (>= 4.5:1) on their surfaces; --line is decoration only. */
  :root {
    color-scheme: light dark;
    --bg: #f5f5f4;
    --surface: #ffffff;
    --surface-2: #fafaf9;
    --fg: #1c1917;
    --muted: #57534e;
    --line: #e7e5e4;
    --pass: #15803d;
    --pass-bg: #dcfce7;
    --fail: #b91c1c;
    --fail-bg: #fee2e2;
    --accent: #1d4ed8;
    --accent-bg: #dbeafe;
    --chip-bg: #f5f5f4;
    --live: #dc2626;
    --term-chrome: #1c1917;
    --term-chrome-fg: #d6d3d1;
    --term-bg: #111111;
    --radius: 10px;
    --gap: 16px;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c0a09;
      --surface: #1c1917;
      --surface-2: #171412;
      --fg: #e7e5e4;
      --muted: #a8a29e;
      --line: #2e2a27;
      --pass: #4ade80;
      --pass-bg: #123d24;
      --fail: #fca5a5;
      --fail-bg: #4c1414;
      --accent: #93c5fd;
      --accent-bg: #1e3a5f;
      --chip-bg: #292524;
      --live: #f87171;
      --term-chrome: #292524;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 var(--sans);
    display: flex;
    flex-direction: column;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Header: who and what, and whether it's still going */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 10px var(--gap);
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .ident { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex: 1 1 320px; }
  .brand { color: var(--muted); font-weight: 600; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  #session { font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40vw; }
  #command { font-family: var(--mono); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 12px;
    background: var(--chip-bg); color: var(--muted); white-space: nowrap;
  }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .pill.running { background: var(--pass-bg); color: var(--pass); }
  .pill.running::before { animation: pulse 1.4s ease-in-out infinite; }
  .pill.failed { background: var(--fail-bg); color: var(--fail); }
  @keyframes pulse { 50% { opacity: .25; } }

  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(320px, 400px);
    gap: var(--gap);
    padding: var(--gap);
  }
  .stage { display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; }

  /* The terminal: the thing being watched, so it gets the room */
  .terminal { background: var(--term-chrome); border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 2px rgb(0 0 0 / .12), 0 8px 24px rgb(0 0 0 / .12); }
  .terminal .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; color: var(--term-chrome-fg); font-size: 12px; }
  .terminal .bar .title { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .terminal .bar .size { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; letter-spacing: .06em; background: rgb(255 255 255 / .08); color: var(--term-chrome-fg); white-space: nowrap; }
  .badge.live { background: #dc2626; color: #fff; }
  .badge.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #fff; animation: pulse 1.4s ease-in-out infinite; }
  .badge.offline { background: #7f1d1d; color: #fff; }
  .viewport { position: relative; background: var(--term-bg); display: flex; justify-content: center; align-items: center; min-height: 180px; padding: 8px 10px; }
  .viewport img { display: block; width: 100%; height: auto; max-height: calc(100vh - 250px); object-fit: contain; transition: filter .3s, opacity .3s; }
  .viewport .placeholder { color: #d6d3d1; font-family: var(--mono); font-size: 13px; padding: 48px 16px; text-align: center; }
  .terminal.ended .viewport img { filter: saturate(.5); opacity: .7; }
  .ended-note { display: none; position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: rgb(28 25 23 / .92); color: #fafaf9; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgb(0 0 0 / .3); white-space: nowrap; }
  .terminal.ended .ended-note { display: block; }

  /* What the agent did last */
  .latest { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 10px; padding: 10px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .latest .label { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .latest .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .latest .what.pass { color: var(--pass); }
  .latest .what.fail { color: var(--fail); }
  .latest .ago { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .latest code { font-family: var(--mono); font-size: 12px; }

  /* Side panel: verdict, then the timeline */
  aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .verdict { padding: 14px; }
  .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
  .counts div { display: flex; flex-direction: column; }
  .counts dt { font-size: 12px; color: var(--muted); }
  .counts dd { margin: 0; font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  #passed { color: var(--pass); }
  #failed.nonzero { color: var(--fail); }
  .meter { display: flex; height: 8px; margin: 12px 0 10px; border-radius: 999px; overflow: hidden; background: var(--chip-bg); }
  .meter span { display: block; height: 100%; }
  #meter-pass { background: var(--pass); width: 0; }
  #meter-fail { background: var(--fail); width: 0; }
  .facts { display: flex; gap: 18px; font-size: 12px; color: var(--muted); }
  .facts b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
  #summary { display: none; padding: 10px 14px; border-radius: var(--radius); font-weight: 600; }
  #summary.shown { display: block; }
  #summary.pass { background: var(--pass-bg); color: var(--pass); }
  #summary.fail { background: var(--fail-bg); color: var(--fail); }

  .log { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .log-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 14px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .log-head h2 { font-size: 13px; margin: 0; }
  .filters { display: inline-flex; gap: 2px; padding: 2px; background: var(--chip-bg); border-radius: 8px; }
  .filters button { border: 0; background: transparent; padding: 2px 9px; border-radius: 6px; font-size: 12px; color: var(--muted); cursor: pointer; }
  .filters button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
  .filters .n { font-variant-numeric: tabular-nums; opacity: .8; margin-left: 3px; }
  #follow { border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 6px; padding: 2px 10px; font-size: 12px; cursor: pointer; margin: 8px 14px 0; align-self: flex-end; }
  #timeline { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; flex: 1; }
  #timeline .empty { color: var(--muted); padding: 14px; }
  #timeline[data-filter="checks"] > .event:not([data-check]),
  #timeline[data-filter="failures"] > .event:not([data-fail]),
  #timeline[data-filter="inputs"] > .event:not([data-input]) { display: none; }
  .event { display: grid; grid-template-columns: 52px 100px minmax(0, 1fr); gap: 2px 8px; padding: 6px 14px; border-left: 3px solid transparent; }
  .event.pass { border-left-color: var(--pass); }
  .event.fail { border-left-color: var(--fail); background: color-mix(in srgb, var(--fail-bg) 50%, transparent); }
  .event .at { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; padding-top: 1px; }
  .event .kind { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); padding-top: 2px; white-space: nowrap; }
  .event.pass .kind { color: var(--pass); }
  .event.fail .kind { color: var(--fail); }
  .event.input .kind { color: var(--accent); }
  .event .text { overflow-wrap: anywhere; }
  .event code { font-family: var(--mono); font-size: 12px; background: var(--chip-bg); padding: 0 4px; border-radius: 4px; }
  .event .detail { grid-column: 3; color: var(--muted); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); margin: 0; max-height: 9em; overflow-y: auto; }
  .event.fail .detail { color: var(--fail); }

  @media (prefers-reduced-motion: reduce) {
    .pill.running::before, .badge.live::before { animation: none; }
    .viewport img { transition: none; }
  }
  @media (max-width: 960px) {
    /* One column, and the page scrolls instead of the timeline */
    html, body { height: auto; }
    main { grid-template-columns: minmax(0, 1fr); min-height: auto; }
    .viewport img { max-height: none; }
    #timeline { overflow: visible; }
    #follow { display: none !important; }
    #session { max-width: 60vw; }
  }
</style>
</head>
<body>
<header>
  <div class="ident">
    <span class="brand">ShadowPTY</span>
    <span id="session">…</span>
    <span id="command"></span>
  </div>
  <span id="state" class="pill" role="status" aria-live="polite">connecting</span>
</header>
<main>
  <section class="stage" aria-label="Live screen">
    <div id="terminal" class="terminal">
      <div class="bar">
        <span id="connection" class="badge">CONNECTING</span>
        <span id="title" class="title"></span>
        <span id="size" class="size"></span>
      </div>
      <div class="viewport">
        <div id="placeholder" class="placeholder">Waiting for the first frame…</div>
        <img id="frame" alt="Live terminal screen, the same one the agent reads" hidden>
        <div id="ended-note" class="ended-note"></div>
      </div>
    </div>
    <div class="latest" aria-live="polite">
      <span class="label">Latest</span>
      <span id="latest" class="what">Waiting for the agent's first action…</span>
      <span id="latest-ago" class="ago"></span>
    </div>
  </section>
  <aside aria-label="Checks and timeline">
    <section class="card verdict" aria-label="Checks">
      <dl class="counts">
        <div><dt>Passed</dt><dd id="passed">0</dd></div>
        <div><dt>Failed</dt><dd id="failed">0</dd></div>
        <div><dt>Checks</dt><dd id="checks">0</dd></div>
      </dl>
      <div class="meter" role="img" id="meter" aria-label="No checks yet"><span id="meter-pass"></span><span id="meter-fail"></span></div>
      <div class="facts"><span>Elapsed <b id="elapsed">–</b></span><span>Frames <b id="fps">0/s</b></span><span>View-only</span></div>
    </section>
    <div id="summary" role="status" aria-live="polite"></div>
    <section class="card log" aria-label="Timeline">
      <div class="log-head">
        <h2>Timeline</h2>
        <div class="filters" role="group" aria-label="Show">
          <button type="button" data-filter="all" aria-pressed="true">All<span class="n" id="n-all"></span></button>
          <button type="button" data-filter="checks" aria-pressed="false">Checks<span class="n" id="n-checks"></span></button>
          <button type="button" data-filter="failures" aria-pressed="false">Failures<span class="n" id="n-failures"></span></button>
          <button type="button" data-filter="inputs" aria-pressed="false">Inputs<span class="n" id="n-inputs"></span></button>
        </div>
      </div>
      <button id="follow" type="button" hidden>↓ Jump to latest</button>
      <ol id="timeline" data-filter="all"></ol>
    </section>
  </aside>
</main>
<script>
"use strict";
// --- event model (pure; no DOM) ---
// Report events follow the session report's format: {"type": ..., "at_ms": ..., ...}. A check is
// any event with a `passed` field; failed ones carry `error`.

function formatExit(status) {
  if (status === null || status === undefined) return "running";
  if (status === "unknown") return "exited (status unknown)";
  if (typeof status === "object" && "exit_code" in status) return "exited with code " + status.exit_code;
  if (typeof status === "object" && "signal" in status) return "killed by signal " + status.signal;
  return String(status);
}

function exitFailed(status) {
  if (status === null || status === undefined || status === "unknown") return false;
  return !(typeof status === "object" && status.exit_code === 0);
}

function formatMs(ms) {
  if (typeof ms !== "number") return "";
  return ms < 1000 ? ms + " ms" : (ms / 1000).toFixed(ms < 10000 ? 2 : 1) + " s";
}

function formatBytes(n) {
  if (typeof n !== "number") return "";
  return n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(1) + " KB" : (n / 1048576).toFixed(1) + " MB";
}

function quoteList(patterns) {
  return (patterns || []).map((p) => JSON.stringify(p)).join(" or ");
}

function truncate(text, max) {
  const s = String(text);
  return s.length > max ? s.slice(0, max - 1) + "…" : s;
}

// Returns {kind, text, code, detail, tone}. `code` is shown monospaced after `text`.
function describeEvent(ev) {
  const isCheck = "passed" in ev;
  const tone = isCheck ? (ev.passed ? "pass" : "fail") : (ev.type === "input" || ev.type === "paste" ? "input" : "info");
  const took = typeof ev.elapsed_ms === "number" ? " in " + formatMs(ev.elapsed_ms) : "";
  const failure = isCheck && !ev.passed && ev.error ? String(ev.error) : "";
  const out = { kind: ev.type || "event", text: "", code: "", detail: failure, tone };
  switch (ev.type) {
    case "start":
      out.text = "Session started";
      out.code = ev.command ? [ev.command].concat(ev.args || []).join(" ") : "";
      if (ev.rows && ev.cols) out.detail = ev.rows + " rows × " + ev.cols + " cols";
      break;
    case "input":
      out.text = "Typed";
      out.code = ev.keys === undefined ? "" : String(ev.keys);
      if (typeof ev.bytes === "number") out.detail = ev.bytes + " bytes";
      break;
    case "paste":
      out.text = "Pasted " + (typeof ev.bytes === "number" ? formatBytes(ev.bytes) : "text");
      out.detail = ev.text === undefined ? "" : truncate(ev.text, 400);
      break;
    case "resize":
      out.text = "Resized to " + ev.rows + " rows × " + ev.cols + " cols";
      break;
    case "signal":
      out.text = "Sent " + (ev.signal || "a signal");
      out.detail = (ev.target === "process" ? "to process " : "to the foreground process group ") + ev.id;
      out.tone = "input";
      break;
    case "expect": {
      out.kind = "expect";
      const where = ev.target === "screen" ? "on screen" : "in output";
      const syntax = ev.syntax && ev.syntax !== "literal" ? " (" + ev.syntax + ")" : "";
      if (ev.passed) {
        out.text = "Found " + JSON.stringify(ev.matched === undefined ? "" : ev.matched) + " " + where +
          (typeof ev.row === "number" ? " at row " + ev.row : "") + took;
        if ((ev.patterns || []).length > 1) out.detail = "pattern " + ((ev.pattern_index || 0) + 1) + " of " + ev.patterns.length + ": " + quoteList(ev.patterns) + syntax;
        else if (syntax) out.detail = quoteList(ev.patterns) + syntax;
      } else {
        out.text = "Expected " + quoteList(ev.patterns) + syntax + " " + where + (typeof ev.timeout_ms === "number" ? " within " + formatMs(ev.timeout_ms) : "");
      }
      break;
    }
    case "wait_gone":
      out.kind = "wait gone";
      out.text = (ev.passed ? "Gone from screen: " : "Still on screen: ") + quoteList(ev.patterns) + took;
      break;
    case "wait_stable":
      out.kind = "wait stable";
      out.text = ev.passed ? "Screen settled" + took : "Screen didn't settle" + took;
      if (typeof ev.quiet_period_ms === "number") out.text += " (quiet " + formatMs(ev.quiet_period_ms) + ")";
      break;
    case "wait_exit":
      out.kind = "wait exit";
      out.text = ev.passed ? "Process " + formatExit(ev.exit_status) + took : "Process still running" + took;
      break;
    case "run_script": {
      out.kind = "script";
      const commands = ev.commands || [];
      out.text = (ev.passed ? "Ran " : "Script stopped after ") + commands.length + " command" + (commands.length === 1 ? "" : "s") + took;
      out.code = commands.join(" ; ");
      break;
    }
    case "screenshot":
      out.text = "Screenshot" + (ev.format ? " (" + String(ev.format).toUpperCase() + ")" : "") + (typeof ev.bytes === "number" ? ", " + formatBytes(ev.bytes) : "");
      out.code = ev.path || "";
      break;
    case "exit":
      out.text = "Process " + formatExit(ev.exit_status);
      if (exitFailed(ev.exit_status)) out.tone = "fail-soft";
      break;
    case "summary":
      out.text = ev.checks + " checks: " + ev.passed + " passed, " + ev.failed + " failed" +
        (ev.exit_status !== undefined ? " · " + formatExit(ev.exit_status) : "") +
        (typeof ev.duration_ms === "number" ? " · " + formatMs(ev.duration_ms) : "");
      out.tone = ev.failed > 0 ? "fail" : "pass";
      out.detail = "";
      break;
    default: {
      const rest = Object.assign({}, ev);
      delete rest.type;
      delete rest.at_ms;
      out.text = truncate(JSON.stringify(rest), 300);
    }
  }
  return out;
}

function newCounters() {
  return { checks: 0, passed: 0, failed: 0, summary: null };
}

// Counts checks as they come; a summary event, when it arrives, has the final numbers.
function applyCounters(counters, ev) {
  if (ev.type === "summary") {
    counters.summary = ev;
    counters.checks = ev.checks;
    counters.passed = ev.passed;
    counters.failed = ev.failed;
  } else if ("passed" in ev && !counters.summary) {
    counters.checks += 1;
    if (ev.passed) counters.passed += 1;
    else counters.failed += 1;
  }
  return counters;
}
// --- end event model ---

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const token = params.get("t") || "";
const match = location.pathname.match(/^\/s\/([^/]+)$/);
const sessionId = match ? decodeURIComponent(match[1]) : "";
$("session").textContent = sessionId;
document.title = sessionId + " · ShadowPTY live";

const EMPTY_TEXT = "Inputs, checks and screenshots appear here as the agent works.";
let counters = newCounters();
let tally = { all: 0, checks: 0, failures: 0, inputs: 0 };
let status = null;
let connected = false;
let frameUrl = null;
let frameTimes = [];
let following = true;
let lastEventAt = null;
const timeline = $("timeline");

function clock(ms) {
  const s = ms / 1000;
  const m = Math.floor(s / 60);
  return m + ":" + (s % 60).toFixed(1).padStart(4, "0");
}

function showEmpty() {
  const empty = document.createElement("li");
  empty.className = "empty";
  empty.textContent = EMPTY_TEXT;
  timeline.replaceChildren(empty);
}

function resetTimeline() {
  counters = newCounters();
  tally = { all: 0, checks: 0, failures: 0, inputs: 0 };
  lastEventAt = null;
  showEmpty();
  $("summary").className = "";
  $("latest").textContent = "Waiting for the agent's first action…";
  $("latest").className = "what";
  $("latest-ago").textContent = "";
  renderCounters();
}

function renderCounters() {
  $("checks").textContent = counters.checks;
  $("passed").textContent = counters.passed;
  $("failed").textContent = counters.failed;
  $("failed").className = counters.failed > 0 ? "nonzero" : "";
  const total = counters.passed + counters.failed;
  $("meter-pass").style.width = total ? (100 * counters.passed / total) + "%" : "0";
  $("meter-fail").style.width = total ? (100 * counters.failed / total) + "%" : "0";
  $("meter").setAttribute("aria-label", total ? counters.passed + " of " + total + " checks passed" : "No checks yet");
  for (const key of Object.keys(tally)) $("n-" + key).textContent = tally[key] ? tally[key] : "";
}

function addEvent(ev) {
  const d = describeEvent(ev);
  applyCounters(counters, ev);
  if (tally.all === 0) timeline.replaceChildren();
  tally.all += 1;

  const li = document.createElement("li");
  li.className = "event " + (d.tone === "fail-soft" ? "" : d.tone);
  if ("passed" in ev && ev.type !== "summary") { li.dataset.check = ""; tally.checks += 1; }
  if (d.tone === "fail" || d.tone === "fail-soft") { li.dataset.fail = ""; tally.failures += 1; }
  if (d.tone === "input") { li.dataset.input = ""; tally.inputs += 1; }
  const at = document.createElement("span");
  at.className = "at";
  at.textContent = typeof ev.at_ms === "number" ? clock(ev.at_ms) : "";
  const kind = document.createElement("span");
  kind.className = "kind";
  kind.textContent = (d.tone === "pass" ? "✓ " : d.tone === "fail" ? "✗ " : "") + d.kind;
  const text = document.createElement("span");
  text.className = "text";
  text.textContent = d.text;
  if (d.code) {
    const code = document.createElement("code");
    code.textContent = d.code;
    text.append(" ", code);
  }
  li.append(at, kind, text);
  if (d.detail) {
    const detail = document.createElement("pre");
    detail.className = "detail";
    detail.textContent = d.detail;
    li.append(detail);
  }
  timeline.append(li);

  const latest = $("latest");
  latest.replaceChildren(d.text);
  if (d.code) {
    const code = document.createElement("code");
    code.textContent = " " + d.code;
    latest.append(code);
  }
  latest.className = "what" + (d.tone === "pass" || d.tone === "fail" ? " " + d.tone : "");
  lastEventAt = Date.now();

  if (ev.type === "summary") {
    const summary = $("summary");
    summary.textContent = (ev.failed > 0 ? "✗ " : "✓ ") + d.text;
    summary.className = "shown " + (ev.failed > 0 ? "fail" : "pass");
  }
  renderCounters();
  if (following) timeline.scrollTop = timeline.scrollHeight;
}

timeline.addEventListener("scroll", () => {
  following = timeline.scrollHeight - timeline.scrollTop - timeline.clientHeight < 24;
  $("follow").hidden = following;
});
$("follow").addEventListener("click", () => {
  following = true;
  timeline.scrollTop = timeline.scrollHeight;
  $("follow").hidden = true;
});
for (const button of document.querySelectorAll(".filters button")) {
  button.addEventListener("click", () => {
    for (const other of document.querySelectorAll(".filters button")) other.setAttribute("aria-pressed", String(other === button));
    timeline.dataset.filter = button.dataset.filter;
  });
}

function renderStatus() {
  if (!status) return;
  $("command").textContent = status.command;
  $("command").title = status.command;
  $("title").textContent = status.command;
  const pill = $("state");
  const running = status.state === "running";
  const exit = formatExit(status.exit_status);
  if (running) {
    pill.textContent = "running";
    pill.className = "pill running";
  } else {
    pill.textContent = status.state === "closed" ? "ended · " + exit : exit;
    pill.className = "pill" + (exitFailed(status.exit_status) ? " failed" : "");
  }
  $("terminal").classList.toggle("ended", !running);
  $("ended-note").textContent = (status.state === "closed" ? "Session ended · " : "Process ") + exit + " · final screen";
  renderConnection();
}

function renderConnection() {
  const badge = $("connection");
  if (!connected) {
    badge.textContent = "OFFLINE";
    badge.className = "badge offline";
  } else if (status && status.state !== "running") {
    badge.textContent = "ENDED";
    badge.className = "badge";
  } else {
    badge.textContent = "LIVE";
    badge.className = "badge live";
  }
}

function tick() {
  if (status) {
    const end = status.ended_ms || Date.now();
    const s = Math.max(0, (end - status.started_ms) / 1000);
    const m = Math.floor(s / 60);
    $("elapsed").textContent = m > 0 ? m + "m " + String(Math.floor(s % 60)).padStart(2, "0") + "s" : s.toFixed(1) + " s";
  }
  const now = performance.now();
  frameTimes = frameTimes.filter((t) => now - t < 1000);
  $("fps").textContent = frameTimes.length + "/s";
  if (lastEventAt !== null) {
    const ago = Math.round((Date.now() - lastEventAt) / 1000);
    $("latest-ago").textContent = ago < 2 ? "just now" : ago < 60 ? ago + " s ago" : Math.floor(ago / 60) + " min ago";
  }
}
setInterval(tick, 250);

function showFrame(frame) {
  frameTimes.push(performance.now());
  const url = URL.createObjectURL(new Blob([frame.svg], { type: "image/svg+xml" }));
  const img = $("frame");
  const previous = frameUrl;
  frameUrl = url;
  img.onload = () => { if (previous) URL.revokeObjectURL(previous); };
  img.src = url;
  img.hidden = false;
  $("placeholder").hidden = true;
  $("size").textContent = frame.cols + "×" + frame.rows;
}

function connect() {
  const source = new EventSource("/s/" + encodeURIComponent(sessionId) + "/events?t=" + encodeURIComponent(token));
  // Every connection starts with the full history, so start the timeline over
  source.addEventListener("open", () => {
    connected = true;
    resetTimeline();
    renderConnection();
  });
  source.addEventListener("status", (e) => {
    status = JSON.parse(e.data);
    renderStatus();
    tick();
  });
  source.addEventListener("frame", (e) => showFrame(JSON.parse(e.data)));
  source.addEventListener("report", (e) => addEvent(JSON.parse(e.data)));
  source.addEventListener("error", () => {
    connected = false;
    renderConnection();
    if (source.readyState === EventSource.CLOSED) {
      $("state").textContent = "not available";
      $("state").className = "pill failed";
      if (!status) $("placeholder").textContent = "This session isn't being shown live. Check the link, or start the session again with live: true.";
    }
  });
}

showEmpty();
if (sessionId && token) connect();
else {
  $("state").textContent = "bad link";
  $("placeholder").textContent = "The link is missing the session or its token. Use the link from tui_start.";
}
</script>
</body>
</html>
